name: ci

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: osmarpetry/.github/.github/workflows/maven.yml@main
    with:
      java-version: "8"

  dependabot:
    needs: [build]
    if: github.actor == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
    uses: osmarpetry/.github/.github/workflows/dependabot-automerge.yml@main
